<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<title>卯很多 LINE 圖文選單（夥伴）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Zilla+Slab:wght@700&display=swap">
<style>
/* 2500×1686 LINE 大型圖文選單，3×2 格，對應 richmenu-partner.json 的 areas */
html,body{margin:0;width:2500px;height:1686px;overflow:hidden;background:#F1E6D3}
.g{display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;width:2500px;height:1686px}
.c{box-sizing:border-box;border:10px solid #24211C;margin:-5px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;font-family:"Noto Sans TC",sans-serif;color:#24211C;text-align:center}
.t{background:#DCE8C4}.b{background:#FBDCC9}
.k{font-family:"Zilla Slab",serif;font-weight:700;font-size:150px;line-height:1;color:#56663A}
.b .k{color:#D9703F}
.n{font-weight:900;font-size:120px;line-height:1.1}
.s{font-weight:500;font-size:58px;color:#5E574B}
.hot{background:#24211C;color:#F1E6D3}.hot .s{color:#F1E6D3;opacity:.85}.hot .k{color:#F0956A}
</style></head><body>
<div class="g">
  <div class="c t"><span class="k">叫貨</span><span class="n">叫貨・物料費</span><span class="s">下單與抵扣餘額</span></div>
  <div class="c t"><span class="k">帳</span><span class="n">對帳單</span><span class="s">抽成・轉嫁費用明細</span></div>
  <div class="c t"><span class="k">+10天</span><span class="n">撥款進度</span><span class="s">上游入帳後 10 天內</span></div>
  <div class="c b"><span class="k">SGS</span><span class="n">食安稽核</span><span class="s">月稽核・留樣紀錄</span></div>
  <div class="c b hot"><span class="k">檔期</span><span class="n">行銷素材</span><span class="s">本檔立牌・推播文案</span></div>
  <div class="c b"><span class="k">督導</span><span class="n">聯絡督導</span><span class="s">營運問題回報</span></div>
</div>
</body></html>
