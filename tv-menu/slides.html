<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>楊家一鍋滷 輪播字卡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* 每張字卡 640x560，對應電視菜單右上影片區。
     ?card=名稱 只顯示該張。照片卡上方 640x420 透明（照片從底下透出），下方 140px 為白瓷字帶。
     視覺：品牌視覺規範 v3「精緻老店」；字卡只寫品名與價格 */
  :root { --porcelain: #FBF8F3; --brown: #4A2A16; --red: #B42318; --gold: #B8935A; --gold-ink: #8A6A3C;
          --sub: #7C6553; --serif: "Noto Serif TC", serif; --sans: "Noto Sans TC", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { font-family: var(--sans); color: var(--brown); }
  .card { width: 640px; height: 560px; position: relative; overflow: hidden; display: none; }
  .card.on { display: block; }
  .price { color: var(--red); font: 700 1em/1 var(--serif); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
  .price small { font-size: .4em; font-weight: 600; margin-left: 4px; }

  /* 照片卡字帶 */
  .cap { position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: var(--porcelain);
         border-top: 1px solid var(--gold); display: flex; align-items: center; justify-content: space-between; padding: 0 34px; gap: 16px; }
  .cap b { font: 700 40px/1.15 var(--serif); letter-spacing: .06em; white-space: nowrap; }
  .cap .price { font-size: 60px; }
  .cap.brand { justify-content: center; }
  .cap.brand img { height: 112px; }
  .note { position: absolute; right: 12px; top: 10px; font-size: 16px; color: #fff; text-shadow: 0 1px 3px #000; opacity: .85; }

  /* 文字卡 */
  .solid { background: var(--porcelain); }
  .solid.on { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .solid::after { content: ""; position: absolute; inset: 18px; border: 1px solid var(--gold); pointer-events: none; }
  .eyebrow { display: flex; align-items: center; gap: 16px; font: 600 30px/1 var(--serif); letter-spacing: .3em; color: var(--brown); }
  .eyebrow::before, .eyebrow::after { content: ""; width: 56px; height: 1px; background: var(--gold); }
  .eyebrow span { font: 500 17px var(--sans); color: var(--gold-ink); letter-spacing: .28em; display: block; margin-top: 10px; }
  .solid h2 { font: 700 50px/1.25 var(--serif); letter-spacing: .08em; margin-top: 26px; }
  .solid p { font: 500 26px/1.5 var(--sans); color: var(--sub); letter-spacing: .08em; margin-top: 12px; }
  .solid .price.big { font-size: 112px; margin-top: 22px; }
  .solid .save { font: 500 26px var(--sans); color: var(--gold-ink); letter-spacing: .2em; margin-top: 14px; }

  #meal img { width: 92px; }
  #meal h2 { font-size: 44px; margin-top: 18px; }
  #meal .eq { display: flex; align-items: center; gap: 12px; margin-top: 18px; font: 600 28px/1 var(--serif); color: var(--gold-ink); }
  #meal .eq span { color: var(--brown); border-bottom: 1px solid var(--gold); padding-bottom: 6px; letter-spacing: .06em; }
  #meal .price.big { font-size: 86px; margin-top: 18px; }

  #qr img { width: 340px; height: 340px; margin-top: 20px; }
  #qr h2 { font-size: 36px; margin-top: 16px; }
  #qr h2 em { font-style: normal; color: #06C755; font-family: var(--sans); font-weight: 700; margin-right: 10px; }
</style>
</head>
<body>

<section class="card overlay" id="home">
  <span class="note">圖片僅供參考</span>
  <div class="cap brand"><img src="assets/wordmark.png" alt="楊家一鍋滷 50年不斷火"></div>
</section>

<section class="card overlay" id="lurou"><div class="cap"><b>傳香滷肉飯／拌麵</b><span class="price">65<small>元</small></span></div></section>
<section class="card overlay" id="chicken"><div class="cap"><b>蔥香雞絲飯／拌麵</b><span class="price">65<small>元</small></span></div></section>
<section class="card overlay" id="pork"><div class="cap"><b>台式酥香燒肉飯／拌麵</b><span class="price">110<small>元</small></span></div></section>
<section class="card overlay" id="soup1"><span class="note">圖片僅供參考</span><div class="cap"><b>蒜香鮮雞腿湯</b><span class="price">120<small>元</small></span></div></section>
<section class="card overlay" id="soup2"><span class="note">圖片僅供參考</span><div class="cap"><b>百菇鮮雞腿湯</b><span class="price">120<small>元</small></span></div></section>
<section class="card overlay" id="tofu"><div class="cap"><b>古早味豆干絲</b><span class="price">40<small>元</small></span></div></section>

<section class="card solid" id="meal">
  <img src="assets/logo.png" alt="">
  <h2>一碗有肉・有菜・有小食</h2>
  <div class="eq"><span>滷肉飯</span>＋<span>半份青菜</span>＋<span>開胃小食</span></div>
  <p>滷肉・雞絲・雞魯｜飯、拌麵都含</p>
  <div class="price big">65<small>起</small></div>
</section>

<section class="card solid" id="combo">
  <div class="eyebrow"><div>超值套餐<span>SET MEALS</span></div></div>
  <h2>傳香滷肉雙寶</h2>
  <p>滷肉飯／麵＋土魠魚羹</p>
  <div class="price big">130<small>元</small></div>
  <div class="save">省 15</div>
</section>

<section class="card solid" id="qr">
  <img src="assets/qr.png" alt="">
  <h2><em>LINE</em>掃碼線上點餐・免排隊</h2>
</section>

<script>
  const id = new URLSearchParams(location.search).get('card') || 'home';
  document.getElementById(id).classList.add('on');
</script>
</body>
</html>
