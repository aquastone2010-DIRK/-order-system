<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快取GO 員工訂餐</title>
<meta name="theme-color" content="#0f766e">
<meta name="description" content="快取GO 前台：員工預訂餐點、查看訂單、會員點數與優惠票">
<link rel="stylesheet" href="styles.css">
</head>
<body class="front">
<header>
  <div class="demo" id="demoBanner"></div>
  <div class="bar">
    <div class="logo"><i>⚡</i>快取GO</div>
    <span class="role">前台・員工訂餐</span>
    <div class="grow"></div>
    <a class="portal" href="kiosk.html">取餐站畫面</a>
    <a class="portal" href="admin.html">營運後台 →</a>
  </div>
</header>

<main>
  <div id="promo"></div>
  <section class="view on" id="v-app"></section>
</main>
<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script src="app-data.js"></script>
<script src="app-employee.js"></script>
<script>
'use strict';
// 前台啟動：員工訂餐
curView = 'app';

// 行銷橫幅：早鳥倒數、剩食快閃、餐券包
function renderPromo() {
  const now = new Date();
  const tmr = Q.addDays(TODAY(), 1);
  const left = Q.earlyBirdDeadline(tmr, S.cfg) - now;
  const eb = left > 0
    ? `明日早鳥 -${S.cfg.earlyBirdDiscount} 元，剩 ${Math.floor(left / 3600000)} 小時 ${Math.floor(left % 3600000 / 60000)} 分`
    : `早鳥已截止，明日 ${S.cfg.earlyBirdTime} 前預訂後天享 -${S.cfg.earlyBirdDiscount} 元`;
  $('#promo').innerHTML = `<div class="hero">
    <b>⚡ 預訂免排隊，刷卡 ${S.cfg.targetSec} 秒取餐</b>
    <span class="tag">⏰ ${eb}</span>
    ${S.cfg.flashEnabled ? `<span class="tag">🌙 ${S.cfg.flashTime} 後現場快取 ${S.cfg.flashPct / 10} 折</span>` : ''}
    <span class="tag">🎫 餐券包最低每餐 ${money(Math.min(...S.passes.map(p => p.price / p.meals)))}</span>
  </div>`;
}
function renderAll() { renderBanner(); renderPromo(); renderApp(); }

load();
curSite = S.sites[0].id;
renderAll();
setInterval(renderPromo, 30000);
</script>
</body>
</html>
