<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest-market.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="快取GO">
<meta name="format-detection" content="telephone=no">
<title>快取GO 美食街點餐</title>
<meta name="theme-color" content="#0f766e">
<meta name="description" content="快取GO 前台：美食街線上點餐（楊家一鍋滷、一杯紅），免排隊取號">
<link rel="stylesheet" href="styles.css">
<style>
:root{--yj:#8b3a1e;--rc:#9f1239}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--yj:#f0a47f;--rc:#fb7185}}
:root[data-theme="dark"]{--yj:#f0a47f;--rc:#fb7185}
body.front main{max-width:1180px}
.mk-venue{font-size:12px;color:var(--muted)}
.mk-brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.mk-brand{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;position:relative}
.mk-brand img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--surface-2)}
.mk-brand b{display:block;font-size:17px}.mk-brand small{color:var(--muted)}
.mk-brand.on{border-color:var(--bc);box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 20%,transparent)}
.mk-code{position:absolute;top:8px;right:10px;font-style:normal;font-weight:900;color:#fff;background:var(--bc);border-radius:6px;padding:0 7px}
.mk-hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--bc);border-radius:14px;padding:14px;margin-bottom:12px}
.mk-hero>img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.mk-hero h2{font-size:24px;color:var(--bc)}.mk-hero h2 small{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.mk-hero-text{display:flex;flex-direction:column;gap:8px}
.mk-logo{width:56px;height:56px;object-fit:cover;border-radius:50%}
.mk-tag{letter-spacing:.3em;color:var(--muted)}
.mk-line{text-align:center;font-size:12px;font-weight:800;color:#06c755}
.mk-line img{width:110px;height:110px;background:#fff;padding:4px;border-radius:8px;display:block;margin-bottom:4px}
.mk-cats{position:sticky;top:56px;z-index:5;background:var(--bg);padding:8px 0}
.mk-cathead{display:flex;gap:12px;align-items:center;margin:6px 0 10px}
.mk-cathead img{width:88px;height:66px;object-fit:cover;border-radius:10px}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mk-item{display:flex;flex-direction:column;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;padding:0}
.mk-item:hover{border-color:var(--brand)}
.mk-item img{width:100%;aspect-ratio:16/10;object-fit:cover}
.mk-item.photo{grid-row:span 2}
.mk-item.compact{border-left:4px solid var(--brand-2)}
.mk-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.mk-name{font-weight:800}
.mk-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;flex-wrap:wrap}
.mk-price{font-size:17px;color:var(--brand)}
.mk-add{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900}
.mk-item.off{opacity:.55;cursor:not-allowed}
#mkCart h3{margin-bottom:8px}
.mk-cgroup{border-bottom:1px dashed var(--border);padding:8px 0}
.mk-cline{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.mk-done{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-top:8px}
.mk-done b{font-size:28px;font-variant-numeric:tabular-nums}
.mk-done.ready{border-color:var(--accent);background:var(--accent-soft)}
#mkSheet{display:none;position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#mkSheet.on{display:flex}
.mk-sheet{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.mk-sheet>img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.mk-cartbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:40;display:none;align-items:center;justify-content:space-between;gap:10px;background:#0f172a;color:#fff;border-radius:12px;padding:10px 14px}
@media(max-width:860px){
  .mk-hero{grid-template-columns:96px minmax(0,1fr);gap:12px}.mk-line{display:none}
  .mk-hero>img{aspect-ratio:1}
  .mk-hero h2{font-size:20px}.mk-logo{display:none}
  .mk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mk-cartbar:not(.hide){display:flex}
  body.front main{padding-bottom:80px}
}
</style>
</head>
<body class="front">
<header>
  <div class="demo" id="demoBanner"></div>
  <div class="bar">
    <div class="logo"><i>⚡</i>快取GO</div><img class="brandlogo" src="img/brand-logo.png" alt="品富食品 PIN FU FOODS" onerror="this.outerHTML='<span class=&quot;brandtext&quot;>品富食品 <small>PIN FU FOODS</small></span>'">
    <span class="role">前台・美食街點餐</span>
    <span class="mk-venue" id="mkVenue"></span>
    <div class="grow"></div>
    <a class="portal keep" href="board.html?site=TCH">叫號大螢幕</a>
    <a class="portal" href="index.html">員工訂餐</a>
    <a class="portal" href="admin.html">營運後台 →</a>
  </div>
</header>

<main>
  <div class="mk-brands" id="mkBrands"></div>
  <div id="mkHero"></div>
  <div class="grid side">
    <div>
      <div class="chips mk-cats" id="mkCats"></div>
      <div id="mkItems"></div>
    </div>
    <div class="grid" style="align-self:start;position:sticky;top:64px">
      <div class="card pad" id="mkMine"></div>
      <div class="card pad" id="mkCart"></div>
    </div>
  </div>
</main>
<div class="mk-cartbar hide" id="mkCartBar"></div>
<div id="mkSheet"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="cloud.js" onerror="qgCloudFailed()"></script>
<script src="core.js"></script>
<script src="menu-data.js"></script>
<script src="app-data.js"></script>
<script src="market-store.js"></script>
<script src="app-market.js"></script>
<script>
'use strict';
// 前台啟動：美食街點餐
curView = 'market';
function renderAll() { renderBanner(); renderMarket(); }

load();
MK.venue = venueById(new URLSearchParams(location.search).get('venue')) || QGMarket.venues[0];
curSite = MK.venue.id;
const b0 = new URLSearchParams(location.search).get('brand');
if (b0 && MK.venue.brands.includes(b0)) MK.brand = b0;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#mkSheet').addEventListener('click', e => { if (e.target.id === 'mkSheet') closeSheet(); });
$('#mkItems').innerHTML = '<p class="muted">連線中…</p>';
MS.init().then(() => {
  MS.watch(MK.venue.id, TODAY(), () => renderMine());
  MK.venue.brands.forEach(b => MS.watchMenu(b, so => { MK.soldOut[b] = so; renderMarket(); }));
  renderAll();
});
// 跨日自動重新載入（取餐號每日從 001 重新開始）
const bootDay = TODAY();
setInterval(() => { if (TODAY() !== bootDay) location.reload(); }, 60000);
</script>
<script src="pwa.js"></script>
</body>
</html>
